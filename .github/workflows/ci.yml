name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements-dev.txt

      - name: Compile source
        run: |
          python -m py_compile \
            app_paths.py audio_activity.py chunker.py dependencies.py \
            diagnostics.py extractor.py i18n.py languages.py main.py \
            media_launcher.py mpv_config.py muxer.py network_tls.py \
            open_subtitles.py \
            operation_control.py pipeline.py settings.py subtitle_sync.py \
            translation_cost.py translator.py ui.py tools/build_translations.py \
            tools/generate_draft_translations.py \
            tools/generate_localized_guides.py

      - name: Check for Python correctness errors
        run: python -m ruff check . --select F

      - name: Validate interface catalogs
        run: |
          python tools/build_translations.py --check
          python tools/build_translations.py --compile

      - name: Run pipeline regressions
        run: python test_pipeline.py

      - name: Run product tests
        run: python -m unittest -v test_product.py

      - name: Smoke-test Qt interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from unittest import mock

          import i18n
          import settings
          from PySide6.QtWidgets import QApplication
          from open_subtitles import SubtitleCandidate, SubtitleSearchResult
          from ui import CandidateDialog, MainWindow, apply_application_style

          application = QApplication([])
          i18n.install_translators(application, "ar")
          apply_application_style(application)
          MainWindow._show_first_run = lambda self: None
          with (
              mock.patch.object(
                  settings.SecretStore,
                  "get",
                  side_effect=AssertionError("startup read a Keychain secret"),
              ),
              mock.patch.object(
                  settings.SecretStore,
                  "set",
                  side_effect=AssertionError("startup wrote a Keychain secret"),
              ),
          ):
              window = MainWindow("ci")
          window.show()
          application.processEvents()
          assert window.tabs.count() == 3
          assert window.target_combo.count() == 30
          assert application.isRightToLeft()
          window.close()

          candidate = SubtitleCandidate(
              file_id=42,
              release_name="Example.Movie.2026.1080p-GROUP",
              file_name="example.srt",
              language="vi",
              download_count=100,
              rating=8.5,
              trusted=True,
              source={
                  "attributes": {
                      "feature_details": {
                          "title": "Example Movie",
                          "year": 2026,
                      }
                  }
              },
          )
          review = CandidateDialog(
              None,
              api_key="unused",
              video_path="/tmp/example.mkv",
              target_language="vi",
              initial_result=SubtitleSearchResult(
                  query="Example Movie",
                  candidates=(candidate,),
                  automatic_matches=(candidate,),
                  matched_by_hash=False,
              ),
          )
          review.show()
          application.processEvents()
          assert review.table.rowCount() == 1
          review.close()
          PY
